<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Request - Attenda 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .card { border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="container" style="max-width: 500px;">
        <div class="card p-4">
            <h4 class="fw-bold text-center mb-4" style="color: #dc2626;">Submit Leave Request</h4>
            <form action="{{ url_for('leave') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Student Index No (ST-XXXX)</label>
                    <input type="text" name="index_no" class="form-control" required placeholder="Ex: ST-1001">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Leave Date</label>
                    <input type="date" name="leave_date" class="form-control" required value="{{ today_date }}">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Reason</label>
                    <textarea name="reason" class="form-control" rows="3" required placeholder="උණ රෝගය නිසා අද දින පැමිණිය නොහැක..."></textarea>
                </div>
                <button type="submit" class="btn btn-danger w-100 fw-bold">Submit Leave</button>

            </form>
        </div>
    </div>
</body>
</html>
